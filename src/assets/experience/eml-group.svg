<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EML Group Placeholder Logo</title>
  <desc id="desc">Simple placeholder logo with EML initials</desc>
  <defs>
    <linearGradient id="emlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00467F" />
      <stop offset="100%" stop-color="#A5CC82" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="32" fill="url(#emlGradient)" />
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="64" font-weight="700" fill="#FFFFFF">
    EML
  </text>
</svg>
