<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NSW Electoral Commission Placeholder Logo</title>
  <desc id="desc">Simple placeholder logo with NSW EC initials</desc>
  <defs>
    <linearGradient id="nswEcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#42A5F5" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="32" fill="url(#nswEcGradient)" />
  <text x="50%" y="45%" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="52" font-weight="700" fill="#FFFFFF">
    NSW
  </text>
  <text x="50%" y="65%" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="40" font-weight="600" fill="#E3F2FD">
    EC
  </text>
</svg>
